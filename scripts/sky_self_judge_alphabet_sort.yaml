# SkyPilot launch for the per-turn self-judge alphabet-sort experiment (single node).
#
#   sky launch -c self-judge-alphabet-sort scripts/sky_self_judge_alphabet_sort.yaml -y
#   # control arm (no advantage reshaping):
#   sky launch -c self-judge-alphabet-sort-ctrl scripts/sky_self_judge_alphabet_sort.yaml \
#       --env CONFIG=configs/self_judge/alphabet_sort_ctrl.toml -y
#
# Needs a .env (see .env.dist) with HF_TOKEN, and a ~/.netrc with wandb creds (plus
# github.com for the private research-environments submodule). alphabet-sort is a
# workspace env, so no hub install / PRIME_API_KEY is needed.

name: self-judge-alphabet-sort

resources:
  infra: kubernetes
  image_id: 211125782317.dkr.ecr.us-west-2.amazonaws.com/hai-training/base-cuda-aws:cuda12.8.1-efa1.45.1-ofiv1.17.2-ncclv2.27.5-1-dev
  # 2 trainer GPUs (FSDP-shard the 4B model + Adam states; 1 GPU OOMs) + 2 vLLM.
  # Keep accelerators == num_train_gpus + num_infer_gpus and dp == num_infer_gpus.
  accelerators: H100:4
  cpus: 64+
  memory: 512GB+
  autostop:
    idle_minutes: 30
    down: true

num_nodes: 1

workdir: .

file_mounts:
  ~/sky_workdir/.env: .env
  ~/.netrc: ~/.netrc  # submodule HTTPS auth + wandb credentials

envs:
  # Treatment by default; override with --env CONFIG=configs/self_judge/alphabet_sort_ctrl.toml
  CONFIG: configs/self_judge/alphabet_sort.toml
  # A git worktree breaks hatch-vcs version inference; harmless placeholder.
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

setup: |
  set -eux
  curl -LsSf https://astral.sh/uv/0.10.12/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  cd ~/sky_workdir
  # .gitmodules uses SSH URLs; rewrite to HTTPS so public submodules clone keylessly.
  git config --global url."https://github.com/".insteadOf "git@github.com:"
  # Only deps/ is needed. configs/private (research-configs) is a private repo
  # unrelated to this run, and the netrc has no github.com creds for it.
  git submodule update --init --recursive deps
  # --all-extras installs the workspace envs (incl. alphabet-sort + self-judge-wrapper).
  uv sync --all-extras
  uv run --no-sync python -c "import alphabet_sort, self_judge_wrapper; print('envs OK')"

run: |
  set -eux -o pipefail
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$PATH"
  # set +x around the source so the secret values aren't echoed into the job logs.
  set +x; set -a; [ -f .env ] && source .env; set +a; set -x
  # torch needs NCCL >= 2.28 (ncclDevCommCreate). The image's system NCCL 2.27.5 is
  # on LD_LIBRARY_PATH and gets loaded first (soname dedup beats torch's RPATH), so
  # preload torch's bundled 2.28.9 to win the resolution.
  export LD_PRELOAD="$(ls -d "$PWD"/.venv/lib/python*/site-packages/nvidia/nccl/lib)/libnccl.so.2${LD_PRELOAD:+:$LD_PRELOAD}"
  # --no-sync: a re-sync would uninstall the editable workspace packages.
  uv run --no-sync rl @ "$CONFIG" --wandb
