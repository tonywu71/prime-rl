# SkyPilot launch for the per-turn self-judge AutomationBench experiment (single node).
#
#   sky launch -c self-judge-ab scripts/sky_self_judge_automationbench.yaml -y
#   # control arm (no advantage reshaping):
#   sky launch -c self-judge-ab-ctrl scripts/sky_self_judge_automationbench.yaml \
#       --env CONFIG=configs/self_judge/automationbench_ctrl.toml -y
#
# Needs a .env (see .env.dist) with PRIME_API_KEY + HF_TOKEN, and a ~/.netrc with
# wandb creds (plus github.com for the public submodules).

name: self-judge-automationbench

resources:
  infra: kubernetes
  image_id: 211125782317.dkr.ecr.us-west-2.amazonaws.com/hai-training/base-cuda-aws:cuda12.8.1-efa1.45.1-ofiv1.17.2-ncclv2.27.5-1-dev
  # 4 trainer (cp=2 × dp_shard=2 for the 4B + fp32 Adam) + 4 vLLM. Keep accelerators
  # == num_train_gpus + num_infer_gpus and dp == num_infer_gpus.
  accelerators: H100:8
  cpus: 64+
  memory: 512GB+
  autostop:
    idle_minutes: 30
    down: true

num_nodes: 1

workdir: .

file_mounts:
  ~/sky_workdir/.env: .env
  ~/.netrc: ~/.netrc  # submodule HTTPS auth + wandb credentials

envs:
  # Treatment by default; override with --env CONFIG=configs/self_judge/automationbench_ctrl.toml
  CONFIG: configs/self_judge/automationbench.toml
  # A git worktree breaks hatch-vcs version inference; harmless placeholder.
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

setup: |
  set -eux
  curl -LsSf https://astral.sh/uv/0.10.12/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  cd ~/sky_workdir
  # .gitmodules uses SSH URLs; rewrite to HTTPS so public submodules clone keylessly.
  git config --global url."https://github.com/".insteadOf "git@github.com:"
  # Only deps/ is needed. configs/private (research-configs) is a private repo
  # unrelated to this run, and the netrc has no github.com creds for it.
  git submodule update --init --recursive deps
  # verifiers>=dev17 declares nemogym/openenv as conflicting extras, so plain
  # --all-extras can't resolve; drop the two unused integration extras.
  uv sync --all-extras --no-extra nemogym --no-extra openenv
  uv tool install prime
  # set +x around the source so PRIME_API_KEY isn't echoed into the job logs.
  set +x; set -a; [ -f .env ] && source .env; set +a; set -x
  prime env install zapier/AutomationBench
  uv run --no-sync python -c "import automationbench, self_judge_wrapper; print('envs OK')"

run: |
  set -eux -o pipefail
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$PATH"
  # set +x around the source so the secret values aren't echoed into the job logs.
  set +x; set -a; [ -f .env ] && source .env; set +a; set -x
  # torch needs NCCL >= 2.28 (ncclDevCommCreate). The image's system NCCL 2.27.5 is
  # on LD_LIBRARY_PATH and gets loaded first (soname dedup beats torch's RPATH), so
  # preload torch's bundled 2.28.9 to win the resolution.
  export LD_PRELOAD="$(ls -d "$PWD"/.venv/lib/python*/site-packages/nvidia/nccl/lib)/libnccl.so.2${LD_PRELOAD:+:$LD_PRELOAD}"
  # The 4B trainer OOMs by a hair at long seq_len; reclaim fragmented reserved memory.
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  # --no-sync: a re-sync would uninstall the editable workspace packages.
  uv run --no-sync rl @ "$CONFIG" --wandb
