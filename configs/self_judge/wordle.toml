# Per-turn self-judge on Wordle with the SFT thinking model — the only testbed that
# produced real signal: differentiated per-turn labels (REGRESS/PROGRESS/ACHIEVED)
# and within_rollout_adv_std > 0. Each guess genuinely progresses, regresses, or wins,
# so labels vary across turns (unlike monotonic envs like alphabet-sort).
max_steps = 200
seq_len = 8192

[deployment]
num_train_gpus = 1
num_infer_gpus = 3

[wandb]
project = "self-judge-wordle"
name = "self-judge-wordle"

[ckpt]

[model]
# SFT thinking Qwen3: plays Wordle well from step 0 (reward variance) and the grader
# differentiates turns. It always reasons, so the label budget below must be generous
# and the parser reads the verdict after </think>.
name = "PrimeIntellect/Qwen3-1.7B-Wordle-SFT"

[orchestrator]
batch_size = 1024
group_size = 16

[orchestrator.self_judge]
alpha = 0.5
flip_false_achieved = true
clamp_fail_dampening = true

[[orchestrator.train.env]]
id = "self-judge-wrapper"
name = "wordle"
state_columns = ["_progress_labels"]
# 1024: the SFT model always reasons, so the label budget must cover the whole
# <think> block plus the verdict (512 left ~56% UNPARSED).
args = { base_env_id = "primeintellect/wordle", no_think = true, progress_label_max_tokens = 1024 }

[orchestrator.train.sampling]
max_completion_tokens = 1024

[trainer]

[inference.parallel]
dp = 3

# The SFT model re-emits prior <think> blocks, so the renderer must preserve them.
[orchestrator.renderer]
name = "qwen3"
preserve_all_thinking = true
