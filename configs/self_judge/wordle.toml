# Per-turn self-judge on Wordle — the recommended first experiment. Wordle has
# genuine per-turn progress (each guess narrows the answer), so the labels mean
# something. Modeled on examples/wordle/rl.toml.
max_steps = 200
seq_len = 8192

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[wandb]
project = "self-judge-wordle"
name = "self-judge-wordle"

[ckpt]

[model]
name = "PrimeIntellect/Qwen3-1.7B-Wordle-SFT"

[orchestrator]
batch_size = 1024
group_size = 16

[orchestrator.self_judge]
alpha = 0.5
flip_false_achieved = true
clamp_fail_dampening = true

[[orchestrator.train.env]]
id = "self-judge-wrapper"
name = "wordle"
state_columns = ["_progress_labels"]
# The SFT model always reasons (ignores /no_think), so the label budget must cover
# the full think block plus the word; the parser then reads the answer after </think>.
args = { base_env_id = "primeintellect/wordle", no_think = true, progress_label_max_tokens = 512 }

[orchestrator.train.sampling]
max_completion_tokens = 1024

[trainer]

[inference.parallel]
dp = 1

# The SFT model re-emits prior <think> blocks, so the renderer must preserve them.
[orchestrator.renderer]
name = "qwen3"
preserve_all_thinking = true
