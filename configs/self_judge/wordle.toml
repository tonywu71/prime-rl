# Per-turn self-judge on Wordle — the recommended first experiment. Wordle has
# genuine per-turn progress (each guess narrows the answer), so the labels mean
# something. Modeled on examples/wordle/rl.toml.
max_steps = 200
seq_len = 8192

[deployment]
num_train_gpus = 1
num_infer_gpus = 3

[wandb]
project = "self-judge-wordle"
name = "self-judge-wordle"

[ckpt]

[model]
# Trying a non-reasoning model. Thinking models work too: a prior run used
# PrimeIntellect/Qwen3-1.7B-Wordle-SFT (a thinking Qwen3; labels parse after </think>).
name = "Qwen/Qwen3-4B-Instruct-2507"

[orchestrator]
batch_size = 1024
group_size = 16

[orchestrator.self_judge]
alpha = 0.5
flip_false_achieved = true
clamp_fail_dampening = true

[[orchestrator.train.env]]
id = "self-judge-wrapper"
name = "wordle"
state_columns = ["_progress_labels"]
# Non-reasoning model: the label is a single word, so a tiny budget suffices.
args = { base_env_id = "primeintellect/wordle", progress_label_max_tokens = 32 }

[orchestrator.train.sampling]
max_completion_tokens = 1024

[trainer]

[inference.parallel]
dp = 3

[orchestrator.renderer]
name = "qwen3"
preserve_all_thinking = false
