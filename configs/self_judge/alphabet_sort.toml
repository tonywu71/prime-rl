# Per-turn self-judge on alphabet-sort (verifiers workspace env). A multi-turn
# text task (no backend), so the per-turn labels have something to grade, and a
# non-reasoning model can partially sort -> real outcome variance. Chosen because
# single-turn envs (aime2025, medmcqa, reasoning-core) make the self-judge a no-op.
max_steps = 200
seq_len = 4096

[deployment]
num_train_gpus = 2
num_infer_gpus = 2

[wandb]
project = "self-judge-alphabet-sort"
name = "self-judge-alphabet-sort"

[ckpt]

[model]
# Trying a non-reasoning model. Thinking models work too: a prior run used
# PrimeIntellect/Qwen3-1.7B-Wordle-SFT (a thinking Qwen3; labels parse after </think>).
name = "Qwen/Qwen3-4B-Instruct-2507"

[orchestrator]
batch_size = 1024
group_size = 16

[orchestrator.self_judge]
alpha = 0.5
flip_false_achieved = true
clamp_fail_dampening = true

[[orchestrator.train.env]]
id = "self-judge-wrapper"
name = "alphabet-sort"
state_columns = ["_progress_labels"]
# Non-reasoning model: the label is a single word, so a tiny budget suffices.
args = { base_env_id = "alphabet-sort", progress_label_max_tokens = 32 }

[orchestrator.train.sampling]
max_completion_tokens = 1024

[trainer]

[inference.parallel]
dp = 2

[orchestrator.renderer]
name = "qwen3"
preserve_all_thinking = false
