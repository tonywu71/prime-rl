# Per-turn self-judge on hud/hud-text-2048. Every move has clear per-turn progress
# (a merge raises the score, a wasted move fills the board), so the labels mean
# something, and a non-reasoning model produces real outcome variance.
max_steps = 200
seq_len = 8192

[deployment]
num_train_gpus = 1
num_infer_gpus = 3

[wandb]
project = "self-judge-2048"
name = "self-judge-2048"

[ckpt]

[model]
# Trying a non-reasoning model. Thinking models work too: a prior run used
# PrimeIntellect/Qwen3-1.7B-Wordle-SFT (a thinking Qwen3; labels parse after </think>).
name = "Qwen/Qwen3-4B-Instruct-2507"

[orchestrator]
batch_size = 1024
group_size = 16

[orchestrator.self_judge]
alpha = 0.5
flip_false_achieved = true
clamp_fail_dampening = true

[[orchestrator.train.env]]
id = "self-judge-wrapper"
name = "2048"
state_columns = ["_progress_labels"]
# Non-reasoning model: the label is a single word, so a tiny budget suffices.
args = { base_env_id = "hud-text-2048", progress_label_max_tokens = 32 }

[orchestrator.train.sampling]
max_completion_tokens = 1024

[trainer]

[inference.parallel]
dp = 3

[orchestrator.renderer]
name = "qwen3"
preserve_all_thinking = false
