# Per-turn self-judge credit assignment on a simple text-only multi-turn env.
#
# Wraps `alphabet-sort` with `self-judge-wrapper`: after each action turn the
# policy grades its own most-recent action (a side-channel label), and the
# orchestrator reshapes that turn's per-token advantage, mass-preserving.
#
# `state_columns = ["_progress_labels"]` is REQUIRED so the labels reach the
# orchestrator. `[orchestrator.self_judge]` enables the reshaping (omit it for a
# control arm: identical rollout cost, no gradient effect).
max_steps = 100
seq_len = 2048

[wandb]
project = "self-judge-debug"
name = "self-judge-alphabet-sort"

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[orchestrator]
batch_size = 512
group_size = 16

[orchestrator.self_judge]
alpha = 0.5
flip_false_achieved = true
clamp_fail_dampening = true

[orchestrator.train.sampling]
max_completion_tokens = 512

[[orchestrator.train.env]]
id = "self-judge-wrapper"
name = "alphabet-sort"
state_columns = ["_progress_labels"]
args = { base_env_id = "alphabet-sort", base_args = { min_turns = 3, max_turns = 3 }, progress_label_max_tokens = 8 }

[orchestrator.eval]
interval = 50

[[orchestrator.eval.env]]
id = "self-judge-wrapper"
name = "alphabet-sort"
num_examples = 50
group_size = 4
state_columns = ["_progress_labels"]
args = { base_env_id = "alphabet-sort", base_args = { min_turns = 3, max_turns = 3 }, progress_label_max_tokens = 8 }

[trainer]

[inference]
